name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 has a global WebSocket and 20 does not, which is the difference this SDK has to survive.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  install:
    name: Install as a git dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # What a client actually does. `prepare` has to build from source on a clean checkout, and a
      # missing devDependency or a file left out of `files` only ever shows up here.
      - name: Pack and install the tarball
        run: |
          npm ci
          npm pack --pack-destination /tmp
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install /tmp/cnct-web-sdk-*.tgz
          node --input-type=module -e "
            import { Cnct, CnctHosts, CnctError } from 'cnct-web-sdk';
            const chat = new Cnct().chat('k');
            if (chat.state.status !== 'idle') throw new Error('unexpected initial state');
            if (new Cnct().config.baseUrl !== CnctHosts.production) throw new Error('the default host should be production');
            try { new Cnct({ baseUrl: '' }); throw new Error('an empty host should have thrown'); }
            catch (error) { if (!(error instanceof CnctError)) throw error; }
            console.log('installed package works');
          "
          # The UI is imported by pages rendered on a server: it must load in plain Node, where
          # there is no DOM, and defineCnctChat() must quietly do nothing there.
          node --input-type=module -e "
            const ui = await import('cnct-web-sdk/ui');
            const fixture = await import('cnct-web-sdk/ui/fixture');
            ui.defineCnctChat();
            if (typeof ui.mountChat !== 'function' || typeof fixture.createChatFixture !== 'function') throw new Error('the UI exports are missing');
            if (Object.keys(ui.CNCT_STRINGS.ar).length !== 129) throw new Error('the Arabic table is incomplete');
            console.log('cnct-web-sdk/ui imports on a server');
          "
